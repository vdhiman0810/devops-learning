name: AKS Multi-Env Deploy

on:
  workflow_dispatch:

env:
  ACR_NAME: devopslearningacr01
  IMAGE_NAME: simple-web
  AKS_NAME: aks-devops-learning
  RESOURCE_GROUP: rg-devops-learning

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source files
        run: |
          test -f apps/simple-web/Dockerfile
          test -f infra/aks/simple-web/dev/deployment.yaml
          test -f infra/aks/simple-web/dev/service.yaml
          test -f infra/aks/simple-web/qa/deployment.yaml
          test -f infra/aks/simple-web/qa/service.yaml
          test -f infra/aks/simple-web/prod/deployment.yaml
          test -f infra/aks/simple-web/prod/service.yaml

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name $ACR_NAME

      - name: Build image
        run: docker build -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} ./apps/simple-web

      - name: Push image
        run: docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

  quality:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=client -f infra/aks/simple-web/dev/deployment.yaml
          kubectl apply --dry-run=client -f infra/aks/simple-web/dev/service.yaml
          kubectl apply --dry-run=client -f infra/aks/simple-web/qa/deployment.yaml
          kubectl apply --dry-run=client -f infra/aks/simple-web/qa/service.yaml
          kubectl apply --dry-run=client -f infra/aks/simple-web/prod/deployment.yaml
          kubectl apply --dry-run=client -f infra/aks/simple-web/prod/service.yaml

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name $ACR_NAME

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  deploy-dev:
    needs: [build, quality]
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group $RESOURCE_GROUP --name $AKS_NAME --overwrite-existing

      - name: Update dev image
        run: |
          sed -i "s#image: .*#image: $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ needs.build.outputs.image_tag }}#g" infra/aks/simple-web/dev/deployment.yaml

      - name: Deploy to dev
        run: |
          kubectl apply -n dev -f infra/aks/simple-web/dev/deployment.yaml
          kubectl apply -n dev -f infra/aks/simple-web/dev/service.yaml
          kubectl rollout status deployment/simple-web -n dev

  deploy-qa:
    needs: [build, quality, deploy-dev]
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group $RESOURCE_GROUP --name $AKS_NAME --overwrite-existing

      - name: Update qa image
        run: |
          sed -i "s#image: .*#image: $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ needs.build.outputs.image_tag }}#g" infra/aks/simple-web/qa/deployment.yaml

      - name: Deploy to qa
        run: |
          kubectl apply -n qa -f infra/aks/simple-web/qa/deployment.yaml
          kubectl apply -n qa -f infra/aks/simple-web/qa/service.yaml
          kubectl rollout status deployment/simple-web -n qa

  deploy-prod:
    needs: [build, quality, deploy-qa]
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group $RESOURCE_GROUP --name $AKS_NAME --overwrite-existing

      - name: Update prod image
        run: |
          sed -i "s#image: .*#image: $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ needs.build.outputs.image_tag }}#g" infra/aks/simple-web/prod/deployment.yaml

      - name: Deploy to prod
        run: |
          kubectl apply -n prod -f infra/aks/simple-web/prod/deployment.yaml
          kubectl apply -n prod -f infra/aks/simple-web/prod/service.yaml
          kubectl rollout status deployment/simple-web -n prod
