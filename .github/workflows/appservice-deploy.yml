name: App Service Multi-Stage Deploy

on:
  workflow_dispatch:

env:
  ACR_NAME: devopslearningacr01
  IMAGE_NAME: simple-web
  WEBAPP_NAME: devops-learning-py01
  RESOURCE_GROUP: rg-devops-learning

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source files
        run: |
          test -f apps/simple-web/Dockerfile
          test -f apps/simple-web/site/index.html
          test -f apps/simple-web/site/css/style.css
          test -f apps/simple-web/site/js/app.js
          test -f infra/k8s/simple-web/deployment.yaml
          test -f infra/k8s/simple-web/service.yaml
          test -f infra/helm/simple-web/Chart.yaml

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name $ACR_NAME

      - name: Build image
        run: docker build -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} ./apps/simple-web

      - name: Push image
        run: docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure dev slot exists
        run: |
          az webapp deployment slot create \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot dev || true

      - name: Configure dev slot container
        run: |
          az webapp config container set \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot dev \
            --container-image-name $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ needs.build.outputs.image_tag }} \
            --container-registry-url https://$ACR_NAME.azurecr.io

      - name: Enable managed identity image pull on dev slot
        run: |
          az resource update \
            --resource-group $RESOURCE_GROUP \
            --name web \
            --namespace Microsoft.Web \
            --resource-type config \
            --parent sites/$WEBAPP_NAME/slots/dev \
            --set properties.acrUseManagedIdentityCreds=true

  deploy-qa:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure qa slot exists
        run: |
          az webapp deployment slot create \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot qa || true

      - name: Configure qa slot container
        run: |
          az webapp config container set \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot qa \
            --container-image-name $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ needs.build.outputs.image_tag }} \
            --container-registry-url https://$ACR_NAME.azurecr.io

      - name: Enable managed identity image pull on qa slot
        run: |
          az resource update \
            --resource-group $RESOURCE_GROUP \
            --name web \
            --namespace Microsoft.Web \
            --resource-type config \
            --parent sites/$WEBAPP_NAME/slots/qa \
            --set properties.acrUseManagedIdentityCreds=true

  deploy-preprod:
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: preprod
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure preprod slot exists
        run: |
          az webapp deployment slot create \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot preprod || true

      - name: Configure preprod slot container
        run: |
          az webapp config container set \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot preprod \
            --container-image-name $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ needs.build.outputs.image_tag }} \
            --container-registry-url https://$ACR_NAME.azurecr.io

      - name: Enable managed identity image pull on preprod slot
        run: |
          az resource update \
            --resource-group $RESOURCE_GROUP \
            --name web \
            --namespace Microsoft.Web \
            --resource-type config \
            --parent sites/$WEBAPP_NAME/slots/preprod \
            --set properties.acrUseManagedIdentityCreds=true

  swap-prod:
    needs: deploy-preprod
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Swap preprod to production
        run: |
          az webapp deployment slot swap \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot preprod \
            --target-slot production
