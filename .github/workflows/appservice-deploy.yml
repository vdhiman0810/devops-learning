name: App Service Multi-Stage Deploy

on:
  workflow_dispatch:

env:
  ACR_NAME: devopslearningacr01
  IMAGE_NAME: simple-web
  WEBAPP_NAME: devops-learning-py01
  RESOURCE_GROUP: rg-devops-learning
  UAMI_RESOURCE_ID: /subscriptions/993fd679-de13-47d9-82e9-c90641b65649/resourceGroups/rg-devops-learning/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-appservice-acr-pull
  UAMI_CLIENT_ID: REPLACE_WITH_UAMI_CLIENT_ID

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source files
        run: |
          test -f apps/simple-web/Dockerfile
          test -f apps/simple-web/site/index.html
          test -f apps/simple-web/site/css/style.css
          test -f apps/simple-web/site/js/app.js
          test -f infra/k8s/simple-web/deployment.yaml
          test -f infra/k8s/simple-web/service.yaml
          test -f infra/helm/simple-web/Chart.yaml

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name $ACR_NAME

      - name: Build image
        run: docker build -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} ./apps/simple-web

      - name: Push image
        run: docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

      - name: Delete older ACR image tags and keep current one
        shell: bash
        run: |
          set -e
          TAGS=$(az acr repository show-tags \
            --name $ACR_NAME \
            --repository $IMAGE_NAME \
            --orderby time_desc \
            --output tsv)

          for tag in $TAGS; do
            if [ "$tag" != "${{ github.sha }}" ]; then
              az acr repository delete \
                --name $ACR_NAME \
                --image $IMAGE_NAME:$tag \
                --yes
            fi
          done

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure dev slot exists from main config
        run: |
          az webapp deployment slot create \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot dev \
            --configuration-source $WEBAPP_NAME || true

      - name: Ensure shared UAMI is attached to dev slot
        shell: bash
        run: |
          EXISTS=$(az webapp identity show \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot dev \
            --query "userAssignedIdentities.\"$UAMI_RESOURCE_ID\"" \
            -o tsv 2>/dev/null || true)

          if [ -z "$EXISTS" ]; then
            az webapp identity assign \
              --name $WEBAPP_NAME \
              --resource-group $RESOURCE_GROUP \
              --slot dev \
              --identities $UAMI_RESOURCE_ID
          fi

      - name: Configure dev slot ACR managed identity
        run: |
          az webapp config set \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot dev \
            --acr-use-identity true \
            --acr-identity $UAMI_CLIENT_ID

      - name: Apply container image to dev slot
        run: |
          az webapp config container set \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot dev \
            --container-image-name $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ needs.build.outputs.image_tag }} \
            --container-registry-url https://$ACR_NAME.azurecr.io

      - name: Show dev slot identity
        run: |
          az webapp identity show \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot dev \
            -o json

      - name: Show dev slot config
        run: |
          az webapp config show \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot dev \
            -o json

      - name: Restart dev slot
        run: |
          az webapp restart \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot dev

  deploy-qa:
    needs: [build, deploy-dev]
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure qa slot exists from main config
        run: |
          az webapp deployment slot create \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot qa \
            --configuration-source $WEBAPP_NAME || true

      - name: Ensure shared UAMI is attached to qa slot
        shell: bash
        run: |
          EXISTS=$(az webapp identity show \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot qa \
            --query "userAssignedIdentities.\"$UAMI_RESOURCE_ID\"" \
            -o tsv 2>/dev/null || true)

          if [ -z "$EXISTS" ]; then
            az webapp identity assign \
              --name $WEBAPP_NAME \
              --resource-group $RESOURCE_GROUP \
              --slot qa \
              --identities $UAMI_RESOURCE_ID
          fi

      - name: Configure qa slot ACR managed identity
        run: |
          az webapp config set \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot qa \
            --acr-use-identity true \
            --acr-identity $UAMI_CLIENT_ID

      - name: Apply container image to qa slot
        run: |
          az webapp config container set \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot qa \
            --container-image-name $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ needs.build.outputs.image_tag }} \
            --container-registry-url https://$ACR_NAME.azurecr.io

      - name: Show qa slot identity
        run: |
          az webapp identity show \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot qa \
            -o json

      - name: Show qa slot config
        run: |
          az webapp config show \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot qa \
            -o json

      - name: Restart qa slot
        run: |
          az webapp restart \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot qa

  deploy-preprod:
    needs: [build, deploy-qa]
    runs-on: ubuntu-latest
    environment: preprod
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure preprod slot exists from main config
        run: |
          az webapp deployment slot create \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot preprod \
            --configuration-source $WEBAPP_NAME || true

      - name: Ensure shared UAMI is attached to preprod slot
        shell: bash
        run: |
          EXISTS=$(az webapp identity show \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot preprod \
            --query "userAssignedIdentities.\"$UAMI_RESOURCE_ID\"" \
            -o tsv 2>/dev/null || true)

          if [ -z "$EXISTS" ]; then
            az webapp identity assign \
              --name $WEBAPP_NAME \
              --resource-group $RESOURCE_GROUP \
              --slot preprod \
              --identities $UAMI_RESOURCE_ID
          fi

      - name: Configure preprod slot ACR managed identity
        run: |
          az webapp config set \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot preprod \
            --acr-use-identity true \
            --acr-identity $UAMI_CLIENT_ID

      - name: Apply container image to preprod slot
        run: |
          az webapp config container set \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot preprod \
            --container-image-name $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ needs.build.outputs.image_tag }} \
            --container-registry-url https://$ACR_NAME.azurecr.io

      - name: Show preprod slot identity
        run: |
          az webapp identity show \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot preprod \
            -o json

      - name: Show preprod slot config
        run: |
          az webapp config show \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot preprod \
            -o json

      - name: Restart preprod slot
        run: |
          az webapp restart \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot preprod

  swap-prod:
    needs: [build, deploy-preprod]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure shared UAMI is attached to production app
        shell: bash
        run: |
          EXISTS=$(az webapp identity show \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --query "userAssignedIdentities.\"$UAMI_RESOURCE_ID\"" \
            -o tsv 2>/dev/null || true)

          if [ -z "$EXISTS" ]; then
            az webapp identity assign \
              --name $WEBAPP_NAME \
              --resource-group $RESOURCE_GROUP \
              --identities $UAMI_RESOURCE_ID
          fi

      - name: Configure production ACR managed identity
        run: |
          az webapp config set \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --acr-use-identity true \
            --acr-identity $UAMI_CLIENT_ID

      - name: Show production identity
        run: |
          az webapp identity show \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            -o json

      - name: Show production config
        run: |
          az webapp config show \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            -o json

      - name: Swap preprod to production
        run: |
          az webapp deployment slot swap \
            --name $WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --slot preprod \
            --target-slot production
